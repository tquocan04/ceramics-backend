name: ceramics-backend

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceramics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceramics}
      POSTGRES_DB: ${POSTGRES_DB:-ceramics}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ceramics} -d ${POSTGRES_DB:-ceramics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ceramics}:${POSTGRES_PASSWORD:-ceramics}@db:5432/${POSTGRES_DB:-ceramics}?schema=public
      PORT: 5000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    ports:
      - "5000:5000"
    command: sh -c "npx prisma db push && node dist/server.js"

volumes:
  pgdata:
